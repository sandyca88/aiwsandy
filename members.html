<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pro 會員專區 · AI with Sandy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#FFFFFF;--card:#FAFAFA;--card2:#F0F0F0;--ink:#000;--soft:#555;--line:#E6E6E6;--line2:#CCC;--btn:#000;--btnInk:#FFF;--ok:#15803D;--err:#B91C1C;
  --sans:'Geist','Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--card:#0B0B0B;--card2:#151515;--ink:#FFF;--soft:#9A9A9A;--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.26);--btn:#FFF;--btnInk:#000;--ok:#4ADE80;--err:#F87171}}
:root[data-theme="dark"]{--bg:#000;--card:#0B0B0B;--card2:#151515;--ink:#FFF;--soft:#9A9A9A;--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.26);--btn:#FFF;--btnInk:#000;--ok:#4ADE80;--err:#F87171}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100%}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.brand small{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--soft);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:99px;background:var(--btn);color:var(--btnInk);font-size:14px;font-weight:500;border:0;cursor:pointer;font-family:inherit;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line2)}
/* lock */
.lock{min-height:calc(100svh - 160px);display:flex;align-items:center;justify-content:center;padding:48px 20px}
.lock-card{width:100%;max-width:420px;border:1px solid var(--line);border-radius:24px;background:var(--card);padding:36px;text-align:center}
.lock-ico{width:56px;height:56px;margin:0 auto 20px;border-radius:99px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
.lock h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.02em}
.lock p{margin:10px 0 0;color:var(--soft);font-size:15px;line-height:1.65}
.field{margin-top:28px;display:flex;gap:8px;padding:6px;border:1px solid var(--line2);border-radius:99px;background:var(--bg)}
.field input{flex:1;min-width:0;border:0;background:transparent;padding:0 14px;color:var(--ink);font-size:16px;font-family:inherit;outline:none}
.remember{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:13px;color:var(--soft)}
.remember input{width:16px;height:16px;accent-color:var(--ink)}
.msg{min-height:22px;margin-top:12px;font-size:14px;color:var(--err)}
.help{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--soft);line-height:1.7}
.help a{text-decoration:underline;text-underline-offset:3px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* members */
#members{display:none;padding-bottom:96px}
#members section{margin-top:56px}
.hello{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.face{width:72px;height:72px;border-radius:99px;object-fit:cover;border:2px solid var(--line)}
.hello h1{margin:0;font-size:clamp(26px,3.4vw,36px);font-weight:600;letter-spacing:-.03em}
.hello p{margin:8px 0 0;color:var(--soft);font-size:15px;line-height:1.7;max-width:640px}
.live{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;border:1px solid var(--line);border-radius:20px;background:var(--card);padding:28px}
.live h2{margin:10px 0 0;font-size:22px;font-weight:600}
.live p{margin:6px 0 0;color:var(--soft);font-size:14px}
.tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px}
.dot{width:8px;height:8px;border-radius:99px;background:#EF4444;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:24px}
.head h2{margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em}
.head span{font-family:var(--mono);font-size:13px;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.vid{display:flex;flex-direction:column;gap:10px}
.shot{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card2)}
.shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.vid:hover .shot img{transform:scale(1.04)}
.len{position:absolute;right:8px;bottom:8px;padding:2px 7px;border-radius:5px;background:rgba(0,0,0,.8);color:#fff;font-family:var(--mono);font-size:11px}
.pro{position:absolute;left:8px;bottom:8px;padding:3px 9px;border-radius:99px;background:#FFD23D;color:#1a1033;font-size:11px;font-weight:700}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s;background:rgba(0,0,0,.25);color:#000}
.play svg{width:56px;height:56px;padding:18px;border-radius:99px;background:#fff;box-sizing:border-box}
.vid:hover .play{opacity:1}
.vid h3{margin:0;font-size:16px;font-weight:600;line-height:1.45}
.vid p{margin:0;font-size:14px;line-height:1.6;color:var(--soft)}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.res a{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:22px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s}
.res a:hover{border-color:var(--line2)}
.res strong{font-size:16px}
.res span{font-size:14px;color:var(--soft);line-height:1.6}
.res em{font-style:normal;font-size:13px;margin-top:auto;padding-top:8px}
footer{border-top:1px solid var(--line);padding:28px 0;font-size:13px;color:var(--soft)}
@media (max-width:900px){.grid,.res{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.wrap{padding:0 18px}.grid,.res{grid-template-columns:minmax(0,1fr)}.lock-card{padding:28px 22px}.live{padding:22px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</main>

  var lock = document.getElementById('lock'), box = document.getElementById('members');
  var form = document.getElementById('lockForm'), pw = document.getElementById('pw'), msg = document.getElementById('msg');
  var go = document.getElementById('go'), remember = document.getElementById('remember'), logout = document.getElementById('logout');
  function b(s){ var r = atob(s), a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }
  function unlock(pass){
    var enc = new TextEncoder();

      .then(function(k){ return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(P.s), iterations: P.n, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); })
